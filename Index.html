<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- БАЗОВІ НАЛАШТУВАННЯ --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #050914;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- АНІМОВАНИЙ ФОН --- */
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        /* --- ЕКРАНИ --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 80px); /* Залишаємо місце для меню знизу */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            transition: opacity 0.3s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- БАЛАНС --- */
        .balance-container {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .balance-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .balance-amount {
            font-size: 64px;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s ease;
        }
        
        .balance-amount.pop { animation: popScale 0.15s ease-out; }
        @keyframes popScale { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* --- КНОПКА КЛІКУ --- */
        .click-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .click-button {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            border: 6px solid #60a5fa;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4), inset 0 -10px 20px rgba(0,0,0,0.4), inset 0 10px 20px rgba(255,255,255,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .click-button:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.6), inset 0 5px 15px rgba(0,0,0,0.6);
            border-color: #fbbf24;
        }

        /* Покращена якість ракети (додано фільтр для чіткості та тінь) */
        .click-button span {
            font-size: 130px;
            line-height: 1;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5)) contrast(1.1);
            transition: transform 0.1s ease;
        }

        .click-button:active span { transform: translateY(5px) scale(1.05); }

        .tap-text {
            margin-top: 30px;
            color: #60a5fa;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); color: #fbbf24;}
        }

        /* --- ПЛАВАЮЧІ МОНЕТКИ --- */
        .float-text {
            position: absolute;
            color: #fbbf24;
            font-weight: 900;
            font-size: 32px;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            z-index: 10;
            animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-60px) scale(1.3) rotate(-10deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1) rotate(10deg); opacity: 0; }
        }

        /* --- МАГАЗИН --- */
        #shop-screen {
            justify-content: flex-start;
            padding-top: 50px;
            box-sizing: border-box;
        }

        .shop-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .shop-item {
            width: 85%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
        }

        .shop-item-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .shop-item-title {
            font-size: 18px;
            font-weight: 700;
            color: #60a5fa;
        }

        .shop-item-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 15px;
            padding: 12px 20px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s;
        }

        .buy-btn:active { transform: scale(0.95); }
        .buy-btn:disabled {
            background: #475569;
            box-shadow: none;
            opacity: 0.5;
        }

        /* --- НИЖНЄ МЕНЮ --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-btn .icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .nav-btn.active {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        /* Повідомлення про покупку */
        .toast {
            position: absolute;
            top: 20px;
            background: rgba(34, 197, 94, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 200;
            transform: translateY(-100px);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateY(0); }

    </style>
</head>
<body>

    <div id="stars-container"></div>
    
    <div class="toast" id="toast">Успішно куплено!</div>

    <!-- ЕКРАН 1: ГРА -->
    <div class="screen" id="game-screen">
        <div class="balance-container">
            <div class="balance-title">Ваш Баланс</div>
            <div class="balance-amount" id="balance-wrapper">
                <span id="score">0</span> <span style="font-size: 50px;">🪙</span>
            </div>
        </div>

        <div class="click-area" id="click-area">
            <div class="click-button" id="click-btn">
                <span>🚀</span>
            </div>
            <div class="tap-text">Натискай!</div>
        </div>
    </div>

    <!-- ЕКРАН 2: МАГАЗИН -->
    <div class="screen hidden" id="shop-screen">
        <div class="shop-title">Магазин Покращень</div>
        
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-title">Потужний Клік</div>
                <div class="shop-item-desc">+1 монета за кожен клік</div>
            </div>
            <button class="buy-btn" id="buy-power-btn">Купити (50 🪙)</button>
        </div>

        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-title">Мега Клік</div>
                <div class="shop-item-desc">+5 монет за кожен клік</div>
            </div>
            <button class="buy-btn" id="buy-mega-btn">Купити (500 🪙)</button>
        </div>
    </div>

    <!-- НИЖНЄ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-btn active" id="nav-game" onclick="switchScreen('game')">
            <div class="icon">🚀</div>
            <div>Гра</div>
        </div>
        <div class="nav-btn" id="nav-shop" onclick="switchScreen('shop')">
            <div class="icon">🛒</div>
            <div>Магазин</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#050914');

        // Стан гри
        let score = 0;
        let clickPower = 1; // Скільки монет дає один клік
        
        // Налаштування магазину
        const powerCost = 50;
        const megaCost = 500;

        // Елементи
        let scoreElement = document.getElementById('score');
        let balanceWrapper = document.getElementById('balance-wrapper');
        let clickBtn = document.getElementById('click-btn');
        let clickArea = document.getElementById('click-area');
        let toast = document.getElementById('toast');

        const buyPowerBtn = document.getElementById('buy-power-btn');
        const buyMegaBtn = document.getElementById('buy-mega-btn');

        // --- ГЕНЕРАЦІЯ ЗІРОК ---
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 2}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            starsContainer.appendChild(star);
        }

        // --- ПЕРЕМИКАННЯ ЕКРАНІВ ---
        function switchScreen(screenName) {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('shop-screen').classList.add('hidden');
            document.getElementById('nav-game').classList.remove('active');
            document.getElementById('nav-shop').classList.remove('active');

            document.getElementById(screenName + '-screen').classList.remove('hidden');
            document.getElementById('nav-' + screenName).classList.add('active');
        }

        // --- ОНОВЛЕННЯ ІНТЕРФЕЙСУ ---
        function updateUI() {
            scoreElement.innerText = score;
            
            // Перевірка, чи вистачає грошей на кнопки в магазині
            buyPowerBtn.disabled = score < powerCost;
            buyMegaBtn.disabled = score < megaCost;

            // Анімація цифр
            balanceWrapper.classList.remove('pop');
            void balanceWrapper.offsetWidth;
            balanceWrapper.classList.add('pop');
        }

        function showToast(text) {
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // --- КЛІК ---
        clickBtn.addEventListener('pointerdown', (e) => {
            score += clickPower;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            createFloatText();
            updateUI();
        });

        function createFloatText() {
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.innerText = `+${clickPower}`;
            const randomX = (Math.random() - 0.5) * 40; 
            floatText.style.left = `calc(50% + ${randomX}px)`;
            floatText.style.top = `calc(50% - 20px)`;
            clickArea.appendChild(floatText);
            setTimeout(() => { floatText.remove(); }, 1000);
        }

        // --- КУПІВЛЯ В МАГАЗИНІ ---
        buyPowerBtn.addEventListener('click', () => {
            if (score >= powerCost) {
                score -= powerCost;
                clickPower += 1;
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                showToast("Клік покращено!");
                updateUI();
            }
        });

        buyMegaBtn.addEventListener('click', () => {
            if (score >= megaCost) {
                score -= megaCost;
                clickPower += 5;
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                showToast("Мега клік активовано!");
                updateUI();
            }
        });

        // Початкове налаштування
        updateUI();

    </script>
</body>
  </html>
